<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="simon.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>Press the button below to start</h2>
    <p></p>
    <p id="hide">Press the button below to play again</p>
    <button class="strt">Start</button>
    <div class="container">

        <div class="one">
            <div class="btns red" id="red" type="button">1</div>
            <div class="btns yellow" id="yellow" type="button">2</div>
        </div>
        <div class="two">
            <div class="btns green" id="green" type="button">3</div>
            <div class="btns blue" id="blue" type="button">4</div>
        </div>

    </div>
    <script src="simon.js"></script>
    <br><br>

</body>
</html>
